settings.window.title:
  zh-CN: 窗口
  en: Window
settings.window.remember_size:
  zh-CN: 记住窗口大小
  en: Remember window size
settings.window.remember_size_description:
  zh-CN: 下次启动时恢复上次关闭时的窗口大小和最大化状态。
  en: The next launch restores the window’s size, maximized or not, as it was when it closed.
settings.window.remember_position:
  zh-CN: 记住窗口位置
  en: Remember window position
settings.window.remember_position_description:
  zh-CN: 下次启动时把窗口放回上次所在的屏幕和位置；那块屏幕不在时放在主屏幕中间。
  en: The next launch puts the window back on the same screen and in the same place. If that screen is gone, it opens in the middle of the main screen.

settings.cli.access:
  zh-CN: 访问控制
  en: Access
settings.cli.enabled:
  zh-CN: 启用外部 CLI
  en: Enable external CLI
settings.cli.enabled_description:
  zh-CN: 开启后，本机当前用户下的程序（如 AI Agent）可以通过 shellrs 命令，在已保存的主机上执行命令、传输和同步文件，并查看、新建、修改和删除主机与凭据，无需知道密码。
  en: When on, programs running as you on this computer, such as AI agents, can use the shellrs command to run commands and transfer and sync files on saved hosts, and to view, create, change and delete hosts and credentials, without knowing any password.
settings.cli.binary:
  zh-CN: CLI 二进制
  en: Command
settings.cli.binary_description:
  zh-CN: 把 shellrs 命令加入 PATH，方便在终端和 Agent 中直接调用。
  en: Puts the shellrs command on the PATH so terminals and agents can call it directly.
settings.cli.binary_description_windows:
  zh-CN: 把 shellrs 命令加入当前用户的 PATH，方便在终端和 Agent 中直接调用。重新打开的终端和 Agent 才能找到它。
  en: Puts the shellrs command on your user PATH so terminals and agents can call it directly. Terminals and agents find it once reopened.
settings.cli.skills_description:
  zh-CN: 安装 shellrs skill，让外部 Agent 在连接服务器、执行远程命令和传输文件时使用 shellrs CLI。可安装到通用目录或指定 Agent 的专用目录。
  en: Install the shellrs skill so agents use the shellrs CLI to connect to servers, run remote commands and transfer files. Install it to the shared folder or to a particular agent’s own folder.
settings.cli.status:
  zh-CN: 状态：
  en: "Status:"
settings.cli.checking:
  zh-CN: 正在检查…
  en: Checking…
settings.cli.binary_unsupported:
  zh-CN: 此系统暂不支持安装 shellrs 命令
  en: The shellrs command can’t be installed on this system yet
settings.cli.skill_unsupported:
  zh-CN: 此系统暂不支持安装
  en: Can’t be installed on this system yet
