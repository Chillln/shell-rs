settings.notifications.title:
  zh-CN: 通知
  en: Notifications
settings.notifications.description:
  zh-CN: ShellRS 不在前台时发系统通知；在前台但终端在别的标签时，在窗口右上角提示，点一下切过去。
  en: When ShellRS is in the background, you get a system notification. When it’s in front but the terminal is in another tab, a notice appears at the top right of the window; click it to go there.
settings.notifications.programs:
  zh-CN: 程序发送的通知
  en: Notifications from programs
settings.notifications.programs_description:
  zh-CN: 远程或本地程序用 OSC 9 / 777 请求的通知，例如 printf '\e]9;完成\a'。
  en: Notifications that remote or local programs ask for with OSC 9 / 777, for example printf '\e]9;Done\a'.
settings.notifications.bell:
  zh-CN: 响铃时通知
  en: Notify on bell
settings.notifications.bell_description:
  zh-CN: 终端就在当前标签时不提示。
  en: Not when the terminal is the current tab.

# 终端 › 本地终端。
