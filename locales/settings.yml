settings.cli.binary_unavailable:
  zh-CN: 找不到 shellrs-cli.exe：它应在 ShellRS 程序旁边（开发时请先 cargo build）
  en: Can’t find shellrs-cli.exe. It belongs next to the ShellRS program (in development, run cargo build first).
