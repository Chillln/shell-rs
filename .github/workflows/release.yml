# 发布工作流：推送版本标签 v<version> 触发
#
#   verify   校验版本标签、CHANGELOG 章节与更新密钥
#   windows  构建 Windows Inno Setup 安装包
#   publish  上传至存储桶并发布 GitHub Release
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Version and channel
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ steps.version.outputs.version }}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section ## [$version]"
            exit 1
          fi
          cat notes.md
      - name: The build knows the update keys
        run: |
          if grep -q 'pub const TRUSTED_KEYS: &\[&str\] = &\[\];' src/update/build_info.rs; then
            echo "::error::src/update/build_info.rs has no TRUSTED_KEYS: a release would reject every update"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md


  windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Build
        shell: bash
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bins
      - name: Installer
        shell: pwsh
        run: |
          # windows-2025 ships Inno Setup 6.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\target\release" `
            "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\shellrs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  publish:
    needs: [verify, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          cp artifacts/windows/* dist/
          cp artifacts/notes/notes.md notes.md
          ls -l dist
      - name: Signing key
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      - name: Sign the packages
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          cd dist
          for file in ShellRS-*; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$MINISIGN_KEY_FILE" \
              -m "$file" -t "shellrs $VERSION $file"
          done
          sha256sum ShellRS-* > SHA256SUMS
      - name: Upload the packages
        run: |
          aws s3 cp dist "s3://$BUCKET/releases/$VERSION/" --recursive \
            --endpoint-url "$R2" --cache-control "public, max-age=31536000, immutable"
      - name: GitHub release
        run: |
          prerelease=""
          [ "$CHANNEL" = beta ] && prerelease="--prerelease"
          gh release create "v$VERSION" dist/* --title "ShellRS $VERSION" \
            --notes-file notes.md $prerelease
      - name: Manifests, last
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          # The GitHub release just created: clients try it when
          # dl.shellrs.com fails. The repository is public, so it needs no
          # sign-in.
          SHELLRS_MIRROR_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.verify.outputs.version }}
        run: |
          publish() {
            packaging/make-manifest.sh "$VERSION" "$1" notes.md dist "$1.json"
            aws s3 cp "$1.json" "s3://$BUCKET/update/v1/$1.json" --endpoint-url "$R2" \
              --content-type application/json --cache-control "public, max-age=300"
            echo "https://dl.shellrs.com/update/v1/$1.json" >> purge.txt
          }
          publish "$CHANNEL"
          if [ "$CHANNEL" = stable ]; then
            # Beta follows stable unless it is already ahead.
            beta=$(curl -fsS https://dl.shellrs.com/update/v1/beta.json | jq -r .manifest | jq -r .version || true)
            [ -n "$beta" ] || beta=0.0.0
            if python3 - "$VERSION" "$beta" <<'EOF'
          import sys
          def key(version):
              core, _, pre = version.partition("-")
              parts = [int(part) for part in core.split(".")]
              # A release sorts after its pre-releases.
              return parts, (1,) if not pre else (0, pre)
          sys.exit(0 if key(sys.argv[1]) > key(sys.argv[2]) else 1)
          EOF
            then
              publish beta
            fi
          fi
      - name: Purge the manifests from the CDN cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          files=$(jq -R . purge.txt | jq -s '{files: .}')
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data "$files"
      # After the purge: the site's build reads the manifests from dl.shellrs.com.
      - name: Rebuild shellrs.com
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$SITE_DEPLOY_HOOK"
